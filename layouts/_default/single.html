{{ define "main" }}
  <main class="content">
    <article>
      <header>
        <h1>{{ .Title }}</h1>
        {{ with .Params.date }}
          <time datetime="{{ . }}">{{ . }}</time>
        {{ end }}
      </header>

      {{ .Content }}

      {{ partial "footer-cta.html" . }}

    </article>
  </main>
{{ end }}
